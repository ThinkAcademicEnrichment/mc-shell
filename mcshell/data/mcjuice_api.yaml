
namespaces:
  player:
    target: Player
    commands:
    # --- Movement & Position ---- name: getPosbukkit: getLocation()returns: Location
      - name: getPos
        bukkit: getLocation()
        returns: Location
        # Result helper to format Location to "x,y,z"

      - name: setPos
        bukkit: teleport(new Location(player.getWorld(), {x}, {y}, {z}, player.getLocation().getYaw(), player.getLocation().getPitch()))
        args:
          - { name: x, type: double }
          - { name: y, type: double }
          - { name: z, type: double }
        returns: void

      - name: getDirection
        bukkit: getEyeLocation().getDirection()
        returns: Vector

      - name: getRotation
        bukkit: getLocation().getYaw()
        returns: double

      - name: getPitch
        bukkit: getLocation().getPitch()
        returns: double

      # --- Stats & State ---
      - name: getHealth
        bukkit: getHealth()
        returns: double

      - name: setHealth
        bukkit: setHealth({health})
        args:
          - { name: health, type: double }
        returns: void

      - name: getFoodLevel
        bukkit: getFoodLevel()
        returns: int

      - name: setFoodLevel
        bukkit: setFoodLevel({level})
        args:
          - { name: level, type: int }
        returns: void

      - name: sendMessage
        bukkit: sendMessage({message})
        args:
          - { name: message, type: String }
        returns: void
