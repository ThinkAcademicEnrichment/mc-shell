# .github/workflows/python-ci.yml
name: CI Build and Test

on:
  push:
    branches: [ "main", "devel" ]
  pull_request:
    branches: [ "main", "devel" ]
  schedule:
    - cron: "0 0 * * 0"

jobs:
  # --- JOB 1: Standard Ubuntu Run ---
  build-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        python-version: ${{ github.event_name == 'schedule' && fromJSON('["3.10", "3.11", "3.12"]') || fromJSON('["3.10"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 1. Install all three JDKs
      - name: Set up JDK 17
        id: java-17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up JDK 21
        id: java-21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Installed last so JAVA_HOME defaults to Java 25
      - name: Set up JDK 25
        id: java-25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      # 2. Generate toolchains.xml dynamically from the installed paths
      - name: Configure Maven Toolchains
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/toolchains.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>17</version>
                <vendor>openjdk</vendor>
              </provides>
              <configuration>
                <jdkHome>${{ steps.java-17.outputs.path }}</jdkHome>
              </configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>21</version>
                <vendor>openjdk</vendor>
              </provides>
              <configuration>
                <jdkHome>${{ steps.java-21.outputs.path }}</jdkHome>
              </configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>25</version>
                <vendor>openjdk</vendor>
              </provides>
              <configuration>
                <jdkHome>${{ steps.java-25.outputs.path }}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF

      # 3. Call the composite action (now has access to toolchains.xml and all 3 JDKs)
      - name: Run core build and test steps
        uses: ./.github/actions/build-test-mc-shell
        with:
          python-version: ${{ matrix.python-version }}
          run-integration-tests: ${{ github.ref_name == 'main' || github.base_ref == 'main' || github.event_name == 'schedule' }}

      - name: Upload McJuice JAR
        uses: actions/upload-artifact@v4
        with:
          name: mcjuice-jar-python-${{ matrix.python-version }}
          path: mcshell/data/mcjuice-*.jar

  # --- JOB 2: ChromeOS / Debian Container Run ---
  chromeos-container-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref_name == 'main'
    strategy:
      matrix:
        debian-version: ['bookworm']
        
    container:
      image: python:3.10-${{ matrix.debian-version }}
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      
    steps:
      - name: Install base container dependencies
        run: apt-get update && apt-get install -y curl git build-essential

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download McJuice JARs from Job 1
        uses: actions/download-artifact@v4
        with:
          name: mcjuice-jar-python-3.10
          path: mcshell/data/

      - name: Run core build and test steps
        uses: ./.github/actions/build-test-mc-shell
        with:
          python-version: '3.10'
          run-integration-tests: 'true'
          skip-python-setup: 'true'
          skip-mcjuice-build: 'true'