# .github/actions/build-test-mc-shell/action.yml
name: 'Build and Test mc-shell'
description: 'Sets up runtimes, installs dependencies, and runs the test suite'
inputs:
  python-version:
    description: 'The Python version to test against'
    required: true
  run-integration-tests:
    description: 'Whether to run the full integration suite'
    required: false
    default: 'false'
 # --- New: Toggle for Container Environments ---
  skip-python-setup:
    description: 'Skip setup-python if the environment already provides it'
    required: false
    default: 'false'   

runs:
  using: "composite"
  steps:
    # All of these steps run in whatever environment the caller job provides
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # --- Fix: Apply the conditional toggle ---
    - name: Set up Python ${{ inputs.python-version }}
      if: inputs.skip-python-setup != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: mced/package-lock.json

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.2.1
        virtualenvs-create: true
        virtualenvs-in-project: false
        virtualenvs-path: ~/.virtualenvs
        installer-parallel: true

    - name: Install all dependencies
      shell: bash # Required in composite actions
      run: |
        poetry install --no-interaction
        npm --prefix mced ci

    - name: Build application
      working-directory: ./mced
      shell: bash
      run: npm run build

    - name: Run tests
      shell: bash
      run: |
        if [[ "${{ inputs.run-integration-tests }}" == "true" ]]; then
          echo "Running all tests (including integration)..."
          poetry run pytest tests/integration tests/unit tests/mock
        else
          echo "Running fast tests only (skipping integration)..."
          poetry run pytest tests/unit tests/mock
        fi

    - name: Verify package build
      shell: bash
      run: poetry build