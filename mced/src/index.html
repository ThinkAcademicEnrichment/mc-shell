<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>MC-ED Editor</title>
        <!-- SUBSTAGE 2A: Capture and hide the GUI Auth Token -->
        <script>
            const params = new URLSearchParams(window.location.search);
            const auth = params.get('auth');
            if (auth) {
                sessionStorage.setItem('GUI_AUTH_TOKEN', auth);
                // Clean the URL so the token isn't visible/copied
                const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                window.history.replaceState({path: cleanUrl}, '', cleanUrl);
            }

        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
            let resource = args[0];
            let config = args[1] || {};

            // Resolve relative URLs (like 'api/powers') into full absolute URLs safely
            let urlString = resource instanceof Request ? resource.url : resource.toString();
            const parsedUrl = new URL(urlString, window.location.origin);

            // Now we reliably check the absolute path
            if (parsedUrl.pathname.startsWith('/api/')) {
                const token = sessionStorage.getItem('GUI_AUTH_TOKEN');
                if (token) {
                    if (resource instanceof Request) {
                        const newHeaders = new Headers(resource.headers);
                        newHeaders.set('Authorization', 'Bearer ' + token);
                        args[0] = new Request(resource, { headers: newHeaders, ...config });
                    } else {
                        config.headers = config.headers || {};
                        if (config.headers instanceof Headers) {
                            config.headers.set('Authorization', 'Bearer ' + token);
                        } else {
                            config.headers['Authorization'] = 'Bearer ' + token;
                        }
                        args[1] = config;
                    }
                }
            }
            return originalFetch.apply(this, args);
        };

        </script>

        <link rel="stylesheet" href="./editor.css">

    </head>
    <body x-data="{ isLibraryCollapsed: true, isCodeCollapsed: true, keyboardVisible: false }">
            <div class="editor-layout" :class="{ 'library-collapsed': isLibraryCollapsed, 'code-collapsed': isCodeCollapsed }">
                <aside id="power-library-panel">

                    <div class="panel-header">
                        <h2 x-show="!isLibraryCollapsed">Power Library</h2>
                            <button class="toggle-btn"
                                @click="
                                    isLibraryCollapsed = !isLibraryCollapsed;
                                "
                                title="Toggle Library Panel">
                            <span x-text="isLibraryCollapsed ? '▶' : '◀'"></span>
                        </button>
                    </div>
                    <div id="power-list"
                         hx-get="/api/powers?view=editor"
                         hx-trigger="load, library-changed from:window" hx-swap="innerHTML">

                        <p style="padding: 0 8px; color: #888;">Loading powers...</p>
                    </div>
                </aside>

                <main id="main-content-panel">
                    <div id="controls">
                        <button class="btn-picker" @click="isLibraryCollapsed = !isLibraryCollapsed">Toggle Library</button>
                        <button class="btn-events" id="executePowerButton">Run Power</button>
                        <button class="btn-block" id="cancelPowerButton">Cancel Power</button>
                        <button class="btn-digital-set" @click="window.prepareAndOpenSaveModal()">Save Workspace</button>
                        <button class="btn-entity" id="clearWorkspaceButton">Clear Workspace</button>
                        <button class="btn-item" @click="keyboardVisible = !keyboardVisible">Keyboard</button>
                        <button class="btn-geometry" @click="isCodeCollapsed = !isCodeCollapsed">Toggle Python</button>
                    </div>
                    <div id="blocklyDiv"></div>
                </main>

                <aside id="code-preview-panel">
                    <div class="panel-header code-header">
                        <span>Python Code</span>
                        <button class="toggle-btn" @click="
                            isCodeCollapsed = !isCodeCollapsed;
                            "
                            title="Toggle Code Preview">
                            <span x-text="isCodeCollapsed ? '◀' : '▶'"></span>
                        </button>
                    </div>
                    <pre id="code-container" class="language-python" aria-live="polite"><code id="pythonCodeDisplay" class="language-python"># Python code will be generated here...</code></pre>
                </aside>

        </div>

        <template x-teleport="body">
            <div>
                <!-- Save Power Modal -->
                <div x-data="{ show: false, name: '', description: '', category: 'Workspaces', power_id: null, availableCategories: [] }"
                     @open-save-modal.window="
                        show = true;
                        name = $event.detail.name;
                        description = $event.detail.description;
                        category = $event.detail.category;
                        power_id = $event.detail.power_id || null;
                        availableCategories = $event.detail.availableCategories || [];
                     "
                     x-show="show"
                     class="modal-overlay">
                    <div class="modal-content">
                        <h3>Save Power</h3>
                        <form id="savePowerForm" @submit.prevent="show = false">
                            <input type="hidden" name="power_id" x-model="power_id">
                            <div class="form-group">
                                <label for="powerName">Name:</label>
                                <input type="text" id="powerName" name="name" x-model="name" required>
                            </div>
                            <div class="form-group">
                                <label for="powerCategory">Category:</label>
                                <input type="text" id="powerCategory" name="category" x-model="category" list="categoryList" @focus="$el.select()">
                                <datalist id="categoryList">
                                    <template x-for="cat in availableCategories" :key="cat">
                                        <option :value="cat" x-text="cat"></option>
                                    </template>
                                </datalist>
                            </div>
                            <div class="form-group">
                                <label for="powerDescription">Description:</label>
                                <textarea id="powerDescription" name="description" x-model="description"></textarea>
                            </div>
                            <div class="modal-buttons">
                                <button type="submit" class="btn-events" id="confirmSaveButton">Save</button>
                                <button type="button" class="btn-picker" @click="show = false">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Delete Confirm Modal -->
                <div x-data="{ show: false, powerId: null, powerName: '' }"
                     @open-delete-confirm.window="
                        show = true;
                        powerId = $event.detail.powerId;
                        powerName = $event.detail.powerName;
                     "
                     x-show="show"
                     class="modal-overlay">
                    <div class="modal-content">
                        <h3>Delete Power</h3>
                        <p>Are you sure you want to permanently delete the power: <strong x-text="powerName"></strong>?</p>
                        <div class="modal-buttons">
                            <button class="btn-block" @click="window.handleDeletePower(powerId); show = false;">Confirm Deletion</button>
                            <button class="btn-picker" @click="show = false">Cancel</button>
                        </div>
                    </div>
                </div>

                <!-- Simple Prompt Modal -->
                <div x-data="{ show: false, message: '', defaultValue: '', callback: null, inputValue: '' }"
                     @blockly-prompt.window="
                        show = true;
                        message = $event.detail.message;
                        defaultValue = $event.detail.defaultValue;
                        callback = $event.detail.onComplete;
                        inputValue = $event.detail.defaultValue;
                        $nextTick(() => { $refs.promptInput.focus(); });
                     "
                     x-show="show"
                     class="modal-overlay"
                     style="z-index: 35000;">
                    <div class="modal-content">
                        <p x-text="message"></p>
                        <input type="text" x-ref="promptInput" x-model="inputValue" @keyup.enter="callback(inputValue); show = false;">
                        <div class="modal-buttons">
                            <button class="btn-events" @click="callback(inputValue); show = false;">OK</button>
                            <button class="btn-picker" @click="callback(null); show = false;">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <script type="module" src="./index.js"></script>
        <div class="simple-keyboard"
             x-show="keyboardVisible"
             style="position: fixed; bottom: 0; left: 0; width: 100%; z-index: 41000; background: white;">
        </div>
    </body>
</html>
