namespaces:
  player:
    target: Player
    commands:
      - name: getPos
        bukkit: getLocation()
        returns: Location
      - name: setPos
        bukkit: teleport(new Location(player.getWorld(), {x}, {y}, {z}, player.getLocation().getYaw(), player.getLocation().getPitch()))
        args:
          - { name: x, type: double }
          - { name: y, type: double }
          - { name: z, type: double }
        returns: void
      - name: getTilePos
        bukkit: getLocation()
        returns: TileLocation
      - name: setTilePos
        bukkit: teleport(new Location(player.getWorld(), Math.floor({x}) + 0.5, Math.floor({y}), Math.floor({z}) + 0.5, player.getLocation().getYaw(), player.getLocation().getPitch()))
        args:
          - { name: x, type: double }
          - { name: y, type: double }
          - { name: z, type: double }
        returns: void
      - name: getDirection
        bukkit: getEyeLocation().getDirection()
        returns: Vector
      - name: getRotation
        bukkit: getLocation().getYaw()
        returns: double
      - name: getPitch
        bukkit: getLocation().getPitch()
        returns: double
      - name: getHealth
        bukkit: getHealth()
        returns: double
      - name: setHealth
        bukkit: setHealth({health})
        args: [{ name: health, type: double }]
        returns: void

  world:
    target: World
    commands:
      - name: getBlock
        bukkit: getBlockAt({x}, {y}, {z}).getType().name()
        args:
          - { name: x, type: int }
          - { name: y, type: int }
          - { name: z, type: int }
        returns: string

      - name: setBlock
        bukkit: getBlockAt({x}, {y}, {z}).setType(org.bukkit.Material.valueOf({block}.toUpperCase()))
        args:
          - { name: x, type: int }
          - { name: y, type: int }
          - { name: z, type: int }
          - { name: block, type: String }
        returns: void

      - name: getHeight
        bukkit: getHighestBlockYAt({x}, {z})
        args:
          - { name: x, type: int }
          - { name: z, type: int }
        returns: int

      - name: getPlayerId
        bukkit: Bukkit.getPlayer({name}).getEntityId()
        args: [{ name: name, type: String }]
        returns: int

      - name: spawnEntity
        bukkit: spawnEntity(new Location(world, {x}, {y}, {z}), org.bukkit.entity.EntityType.valueOf({type}.toUpperCase())).getEntityId()
        args:
          - { name: x, type: double }
          - { name: y, type: double }
          - { name: z, type: double }
          - { name: type, type: String }
        returns: int

      - name: createExplosion
        bukkit: createExplosion({x}, {y}, {z}, (float){power})
        args:
          - { name: x, type: double }
          - { name: y, type: double }
          - { name: z, type: double }
          - { name: power, type: double }
        returns: void

  chat:
    target: Server
    commands:
      - name: post
        bukkit: broadcastMessage({message})
        args: [{ name: message, type: String }]
        returns: void