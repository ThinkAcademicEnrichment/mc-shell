[tool.poetry]
name = "mc-shell"
version = "0.9.0"
description = "An interactive shell and editor for controlling Minecraft servers and creating powers."
authors = ["Jeff <jeff@thinkae.org>"]
readme = "README.md"
packages = [{include = "mcshell"}]

# MERGED INCLUDE: Must be under [tool.poetry], overriding any .gitignore rules
include = [
    "mcshell/data/app/**/*",
    "mcshell/data/*.jar"
]

[virtualenvs]
in-project = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.10"

# Core Application Dependencies
pexpect = "*"
flask = "*"
flask-cors = "*"
flask-socketio = "*"
python-socketio = {version = "*", extras = ["client"]}
requests = "*"
numpy = "*"
yarl = "==1.20.1"
beautifulsoup4 = "*"
pyyaml = "^6.0.2"

# IPython Shell Dependencies
ipython = "*"
pickleshare = "*" # For %store magic
rich = "*"
click = "*" # For the mcshell CLI entry point

# Minecraft-specific Libraries

# We now use blockapily.BlockGenerator !
blockapily = "^0.3.1"
pytest = "^9.0.2"
mctools = "^1.4.1"
voxelmap = "^5.1.1"
asyncssh = "^2.22.0"
miniupnpc = "^2.3.3"
psutil = "^7.2.2"

[tool.poetry.scripts]
mcshell = "mcshell.mcshell:cli"
