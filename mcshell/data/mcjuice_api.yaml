namespaces:
  player:
    target: Player
    commands:
      # --- Position & Tile ---
      - name: getPos
        bukkit: getLocation()
        returns: Location
        blockly:
          label: "Get Position"
          tooltip: "Gets the exact XYZ position of the player."
          call_args: []

      - name: setPos
        bukkit: teleport(new Location(player.getWorld(), {x}, {y}, {z}, player.getLocation().getYaw(), player.getLocation().getPitch()))
        args: [{ name: x, type: double }, { name: y, type: double }, { name: z, type: double }]
        returns: void
        blockly:
          label: "Set Position to [pos]"
          args:
            pos: { type: Vec3, label: "Position" }
          call_args: [float(pos.x), float(pos.y), float(pos.z)]

      - name: getTilePos
        bukkit: getLocation()
        returns: TileLocation
        blockly:
          label: "Get Tile Position"
          tooltip: "Gets the integer block position of the player."
          call_args: []

      - name: setTilePos
        bukkit: teleport(new Location(player.getWorld(), Math.floor({x}) + 0.5, Math.floor({y}), Math.floor({z}) + 0.5, player.getLocation().getYaw(), player.getLocation().getPitch()))
        args: [{ name: x, type: double }, { name: y, type: double }, { name: z, type: double }]
        returns: void
        blockly:
          label: "Set Tile Position to [pos]"
          args:
            pos: { type: Vec3, label: "Position" }
          call_args: [float(pos.x), float(pos.y), float(pos.z)]

      - name: getDirection
        bukkit: getEyeLocation().getDirection()
        returns: Vector
        blockly:
          label: "Get Direction"
          call_args: []

      - name: setDirection
        bukkit: teleport(player.getLocation().setDirection(new org.bukkit.util.Vector({x}, {y}, {z})))
        args: [{ name: x, type: double }, { name: y, type: double }, { name: z, type: double }]
        returns: void
        blockly:
          label: "Set Direction to [dir]"
          args:
            dir: { type: Vec3, label: "Direction Vector" }
          call_args: [float(dir.x), float(dir.y), float(dir.z)]

      - name: getRotation
        bukkit: getLocation().getYaw()
        returns: double
        blockly:
          label: "Get Rotation"
          call_args: []

      - name: setRotation
        bukkit: |
          {
            org.bukkit.Location l = player.getLocation();
            l.setYaw((float){yaw});
            player.teleport(l);
          }
        args: [{ name: yaw, type: double }]
        returns: void
        blockly:
          label: "Set Rotation to [yaw]"
          args:
            yaw: { type: float, label: "Yaw" }
          call_args: [float(yaw)]

      - name: getPitch
        bukkit: getLocation().getPitch()
        returns: double
        blockly:
          label: "Get Pitch"
          call_args: []

      - name: setPitch
        bukkit: |
          {
            org.bukkit.Location l = player.getLocation();
            l.setPitch((float){pitch});
            player.teleport(l);
          }
        args: [{ name: pitch, type: double }]
        returns: void
        blockly:
          label: "Set Pitch to [pitch]"
          args:
            pitch: { type: float, label: "Pitch" }
          call_args: [float(pitch)]

      - name: getHealth
        bukkit: getHealth()
        returns: double
        blockly:
          label: "Get Health"
          tooltip: "Returns the health of the player."
          call_args: []

      - name: setHealth
        bukkit: setHealth({health})
        args: [{ name: health, type: double }]
        returns: void
        blockly:
          label: "Set Health to [health]"
          args:
            health: { type: float, label: "Health" }
          call_args: [float(health)]

      - name: getFoodLevel
        bukkit: getFoodLevel()
        returns: int
        blockly:
          label: "Get Food Level"
          tooltip: "Returns the food level of the player."
          call_args: []

      - name: setFoodLevel
        bukkit: setFoodLevel({level})
        args: [{ name: level, type: int }]
        returns: void
        blockly:
          label: "Set Food Level to [level]"
          args:
            level: { type: int, label: "Food Level" }
          call_args: [int(level)]

      - name: getDeaths
        bukkit: getStatistic(org.bukkit.Statistic.DEATHS)
        returns: int
        blockly:
          label: "Get Death Count"
          tooltip: "Returns the total number of times the player has died."
          call_args: []

      - name: sendTitle
        bukkit: sendTitle({title}, {subtitle}, 10, {stay}, 20)
        args:
          - { name: title, type: String }
          - { name: subtitle, type: String }
          - { name: stay, type: int }
        returns: void
        blockly:
          label: "Send Title to Screen"
          tooltip: "Sends a title and subtitle to the player's screen."
          args:
            title: { type: str, label: "Title" }
            subtitle: { type: str, label: "Subtitle" }
            stay: { type: int, label: "Stay (Ticks)", shadow: '<shadow type="math_number"><field name="NUM">70</field></shadow>' }
          call_args: [str(title), str(subtitle), int(stay)]

  world:
    target: World
    commands:
      # --- Block Management ---
      - name: getBlock
        bukkit: getBlockAt({x}, {y}, {z}).getType().name()
        args: [{ name: x, type: int }, { name: y, type: int }, { name: z, type: int }]
        returns: string
        blockly:
          label: "Get Block at [position]"
          tooltip: "Returns the Block ID at the specified position."
          returns: Block
          args:
            position: { type: Vec3, label: "Position" }
          call_args: [int(position.x), int(position.y), int(position.z)]

      - name: setBlock
        bukkit: getBlockAt({x}, {y}, {z}).setType(org.bukkit.Material.valueOf({block}.toUpperCase()))
        args: [{ name: x, type: int }, { name: y, type: int }, { name: z, type: int }, { name: block, type: String }]
        returns: void
        blockly:
          label: "Set Block [block_type] at [position]"
          tooltip: "Sets a block at the specified position."
          args:
            position: { type: Vec3, label: "Position" }
            block_type: { type: Block, label: "Block" }
          call_args: [int(position.x), int(position.y), int(position.z), str(block_type)]

      - name: getBlocks
        bukkit: |
          {
            int x1 = {x1}, y1 = {y1}, z1 = {z1}, x2 = {x2}, y2 = {y2}, z2 = {z2};
            int xMin = Math.min(x1, x2), xMax = Math.max(x1, x2);
            int yMin = Math.min(y1, y2), yMax = Math.max(y1, y2);
            int zMin = Math.min(z1, z2), zMax = Math.max(z1, z2);
            StringBuilder sb = new StringBuilder();
            for (int z = zMin; z <= zMax; z++) {
              for (int y = yMin; y <= yMax; y++) {
                for (int x = xMin; x <= xMax; x++) {
                  sb.append(world.getBlockAt(x, y, z).getType().name()).append(",");
                }
              }
            }
            if (sb.length() > 0) sb.setLength(sb.length() - 1);
            session.send(sb.toString());
          }
        args: [{ name: x1, type: int }, { name: y1, type: int }, { name: z1, type: int }, { name: x2, type: int }, { name: y2, type: int }, { name: z2, type: int }]
        returns: string_list
        blockly:
          label: "Get Blocks from [pos1] to [pos2]"
          tooltip: "Returns a list of Block IDs in the specified area."
          args:
            pos1: { type: Vec3, label: "From Position" }
            pos2: { type: Vec3, label: "To Position" }
          call_args: [int(pos1.x), int(pos1.y), int(pos1.z), int(pos2.x), int(pos2.y), int(pos2.z)]

      - name: setBlocks
        bukkit: |
          {
            int xMin = Math.min({x1}, {x2}), xMax = Math.max({x1}, {x2});
            int yMin = Math.min({y1}, {y2}), yMax = Math.max({y1}, {y2});
            int zMin = Math.min({z1}, {z2}), zMax = Math.max({z1}, {z2});
            Material mat = Material.valueOf({block}.toUpperCase());
            for (int x = xMin; x <= xMax; x++) {
              for (int y = yMin; y <= yMax; y++) {
                for (int z = zMin; z <= zMax; z++) {
                  world.getBlockAt(x, y, z).setType(mat, false);
                }
              }
            }
          }
        args: [{ name: x1, type: int }, { name: y1, type: int }, { name: z1, type: int }, { name: x2, type: int }, { name: y2, type: int }, { name: z2, type: int }, { name: block, type: String }]
        returns: void
        blockly:
          label: "Set Blocks [block_type] from [pos1] to [pos2]"
          tooltip: "Fills a cuboid area with the specified block."
          args:
            pos1: { type: Vec3, label: "From Position" }
            pos2: { type: Vec3, label: "To Position" }
            block_type: { type: Block, label: "Block" }
          call_args: [int(pos1.x), int(pos1.y), int(pos1.z), int(pos2.x), int(pos2.y), int(pos2.z), str(block_type)]

      # --- Metadata & Entities ---
      - name: getHeight
        bukkit: getHighestBlockYAt({x}, {z})
        args: [{ name: x, type: int }, { name: z, type: int }]
        returns: int
        blockly:
          label: "Get Highest Block Y at X: [x] Z: [z]"
          tooltip: "Gets the Y coordinate of the highest solid block at X, Z."
          args:
            x: { type: float, label: "X" }
            z: { type: float, label: "Z" }
          call_args: [int(x), int(z)]

      - name: getPlayerId
        bukkit: Bukkit.getPlayer({name}).getEntityId()
        args: [{ name: name, type: String }]
        returns: int

      - name: spawnEntity
        bukkit: spawnEntity(new Location(world, {x}, {y}, {z}), org.bukkit.entity.EntityType.valueOf({type}.toUpperCase())).getEntityId()
        args:
          - { name: x, type: double }
          - { name: y, type: double }
          - { name: z, type: double }
          - { name: type, type: String }
        returns: int
        blockly:
          label: "Spawn [entity_id] at [position]"
          tooltip: "Spawns an entity at a given position and returns its unique ID."
          args:
            position: { type: Vec3, label: "Position" }
            entity_id: { type: Entity, label: "Entity" }
          call_args: [float(position.x), float(position.y), float(position.z), str(entity_id)]

      - name: removeEntity
        bukkit: getEntities().stream().filter(e -> e.getEntityId() == {id}).forEach(org.bukkit.entity.Entity::remove)
        args: [{ name: id, type: int }]
        returns: void
        blockly:
          label: "Remove Entity [entity_id]"
          tooltip: "Removes the entity with the specified ID from the world."
          args:
            entity_id: { type: int, label: "Entity ID" }
          call_args: [int(entity_id)]

      - name: getEntitiesInRadius
        bukkit: getNearbyEntities(new Location(world, {x}, {y}, {z}), {r}, {r}, {r}).stream().map(e -> String.valueOf(e.getEntityId())).collect(java.util.stream.Collectors.joining(","))
        args:
          - { name: x, type: double }
          - { name: y, type: double }
          - { name: z, type: double }
          - { name: r, type: double }
        returns: string_list
        blockly:
          label: "Get Entities in [radius] block radius from [position]"
          tooltip: "Returns a list of entity IDs within a radius of a position."
          args:
            position: { type: Vec3, label: "Position" }
            radius: { type: float, label: "Radius" }
          call_args: [float(position.x), float(position.y), float(position.z), float(radius)]

      - name: createExplosion
        bukkit: createExplosion({x}, {y}, {z}, (float){power})
        args:
          - { name: x, type: double }
          - { name: y, type: double }
          - { name: z, type: double }
          - { name: power, type: double }
        returns: void
        blockly:
          label: "Create Explosion power [power] at [pos]"
          args:
            pos: { type: Vec3, label: "Position" }
            power: { type: float, label: "Power" }
          call_args: [float(pos.x), float(pos.y), float(pos.z), float(power)]

      - name: setSign
        bukkit: |
          {
            org.bukkit.block.Block b = world.getBlockAt({x}, {y}, {z});
            b.setType(org.bukkit.Material.valueOf({sign_type}.toUpperCase()));
            if (b.getBlockData() instanceof org.bukkit.block.data.Rotatable) {
                org.bukkit.block.data.Rotatable rot = (org.bukkit.block.data.Rotatable) b.getBlockData();
                org.bukkit.block.BlockFace[] faces = {org.bukkit.block.BlockFace.SOUTH, org.bukkit.block.BlockFace.SOUTH_SOUTH_WEST, org.bukkit.block.BlockFace.SOUTH_WEST, org.bukkit.block.BlockFace.WEST_SOUTH_WEST, org.bukkit.block.BlockFace.WEST, org.bukkit.block.BlockFace.WEST_NORTH_WEST, org.bukkit.block.BlockFace.NORTH_WEST, org.bukkit.block.BlockFace.NORTH_NORTH_WEST, org.bukkit.block.BlockFace.NORTH, org.bukkit.block.BlockFace.NORTH_NORTH_EAST, org.bukkit.block.BlockFace.NORTH_EAST, org.bukkit.block.BlockFace.EAST_NORTH_EAST, org.bukkit.block.BlockFace.EAST, org.bukkit.block.BlockFace.EAST_SOUTH_EAST, org.bukkit.block.BlockFace.SOUTH_EAST, org.bukkit.block.BlockFace.SOUTH_SOUTH_EAST};
                rot.setRotation(faces[{direction} % 16]);
                b.setBlockData(rot);
            }
            if (b.getState() instanceof org.bukkit.block.Sign) {
                org.bukkit.block.Sign sign = (org.bukkit.block.Sign) b.getState();
                sign.setLine(0, {l1}); sign.setLine(1, {l2}); sign.setLine(2, {l3}); sign.setLine(3, {l4});
                sign.update();
            }
          }
        args:
          - { name: x, type: int }
          - { name: y, type: int }
          - { name: z, type: int }
          - { name: sign_type, type: String }
          - { name: direction, type: int }
          - { name: l1, type: String }
          - { name: l2, type: String }
          - { name: l3, type: String }
          - { name: l4, type: String }
        returns: void
        blockly:
          label: "Set Sign Text"
          tooltip: "Sets the text and type of a sign at the specified position."
          args:
            position: { type: Vec3, label: "At Position" }
            line1: { type: str, label: "Line 1" }
            line2: { type: str, label: "Line 2" }
            line3: { type: str, label: "Line 3" }
            line4: { type: str, label: "Line 4" }
            sign_type: { type: Block, label: "Sign Material", shadow: "minecraft_log_picker" }
            direction: { type: int, label: "Direction (0-15)" }
          call_args: [int(position.x), int(position.y), int(position.z), str(sign_type), int(direction), str(line1), str(line2), str(line3), str(line4)]

      # --- Loot & Items ---
      - name: dropItem
        bukkit: dropItemNaturally(new org.bukkit.Location(world, {x}, {y}, {z}), new org.bukkit.inventory.ItemStack(org.bukkit.Material.valueOf({item}.toUpperCase()), {amount}))
        args:
          - { name: x, type: double }
          - { name: y, type: double }
          - { name: z, type: double }
          - { name: item, type: String }
          - { name: amount, type: int }
        returns: void
        blockly:
          label: "Drop [amount] [item] at [pos]"
          tooltip: "Drops a specific item on the ground at the position."
          args:
            pos: { type: Vec3, label: "Position" }
            item: { type: Item, label: "Item" }
            amount: { type: int, label: "Amount" }
          call_args: [float(pos.x), float(pos.y), float(pos.z), str(item), int(amount)]

      - name: dropRandomLoot
        bukkit: |
          {
            org.bukkit.Material[] pool = {
              org.bukkit.Material.DIAMOND, org.bukkit.Material.GOLD_INGOT, org.bukkit.Material.IRON_INGOT, 
              org.bukkit.Material.EMERALD, org.bukkit.Material.ENCHANTED_GOLDEN_APPLE, 
              org.bukkit.Material.ENDER_PEARL, org.bukkit.Material.TOTEM_OF_UNDYING, 
              org.bukkit.Material.EXPERIENCE_BOTTLE, org.bukkit.Material.SADDLE
            };
            org.bukkit.Material choice = pool[new java.util.Random().nextInt(pool.length)];
            world.dropItemNaturally(new org.bukkit.Location(world, {x}, {y}, {z}), new org.bukkit.inventory.ItemStack(choice, 1));
          }
        args:
          - { name: x, type: double }
          - { name: y, type: double }
          - { name: z, type: double }
        returns: void
        blockly:
          label: "Drop Random Loot at [pos]"
          tooltip: "Drops a random high-value item at the specified position."
          args:
            pos: { type: Vec3, label: "Position" }
          call_args: [float(pos.x), float(pos.y), float(pos.z)]

      - name: setContainerItem
        bukkit: |
          {
            org.bukkit.block.Block b = world.getBlockAt({x}, {y}, {z});
            if (b.getState() instanceof org.bukkit.inventory.InventoryHolder) {
                org.bukkit.inventory.Inventory inv = ((org.bukkit.inventory.InventoryHolder)b.getState()).getInventory();
                inv.setItem({slot}, new org.bukkit.inventory.ItemStack(org.bukkit.Material.valueOf({item}.toUpperCase()), {amount}));
            }
          }
        args:
          - { name: x, type: int }
          - { name: y, type: int }
          - { name: z, type: int }
          - { name: slot, type: int }
          - { name: item, type: String }
          - { name: amount, type: int }
        returns: void
        blockly:
          label: "In container at [pos] set slot [slot] to [amount] [item]"
          tooltip: "Sets an item in a chest, barrel, or hopper inventory slot."
          args:
            pos: { type: Vec3, label: "Position" }
            slot: { type: int, label: "Slot (0-26)" }
            item: { type: Item, label: "Item" }
            amount: { type: int, label: "Amount" }
          call_args: [int(pos.x), int(pos.y), int(pos.z), int(slot), str(item), int(amount)]

      - name: getEntityName
        bukkit: |
          {
            org.bukkit.entity.Entity e = null;
            for (org.bukkit.World w : Bukkit.getWorlds()) {
                for (org.bukkit.entity.Entity ent : w.getEntities()) {
                    if (ent.getEntityId() == {id}) { e = ent; break; }
                }
                if (e != null) break;
            }
            session.send(e != null ? e.getName() : "Unknown");
          }
        args: [{ name: id, type: int }]
        returns: string
        blockly:
          label: "Get Name of Entity ID [id]"
          args:
            id: { type: int, label: "Entity ID" }
          call_args: [int(id)]

  chat:
    target: Server
    commands:
      - name: post
        bukkit: broadcastMessage({message})
        args: [{ name: message, type: String }]
        returns: void
        blockly:
          label: "Post to Chat"
          args:
            message: { type: str, label: "Message" }
          call_args: [str(message)]

# --- EVENT SUBSCRIPTION SECTION ---
events:
  - name: rightBlockHit
    bukkit_event: org.bukkit.event.player.PlayerInteractEvent
    condition: "event.getAction() == org.bukkit.event.block.Action.RIGHT_CLICK_BLOCK && event.getClickedBlock() != null"
    # ENRICHED: Added player name (index 5)
    data: "event.getClickedBlock().getX() + \",\" + event.getClickedBlock().getY() + \",\" + event.getClickedBlock().getZ() + \",\" + event.getBlockFace().ordinal() + \",\" + event.getPlayer().getEntityId() + \",\" + event.getPlayer().getName()"
    blockly:
      label: "Wait for right block hit by a Player"
      returns: "Vec3"
      yields: "event.pos.clone()"
      player_filter: True

  - name: leftBlockHit
    bukkit_event: org.bukkit.event.player.PlayerInteractEvent
    condition: "event.getAction() == org.bukkit.event.block.Action.LEFT_CLICK_BLOCK && event.getClickedBlock() != null"
    # ENRICHED: Added player name (index 5)
    data: "event.getClickedBlock().getX() + \",\" + event.getClickedBlock().getY() + \",\" + event.getClickedBlock().getZ() + \",\" + event.getBlockFace().ordinal() + \",\" + event.getPlayer().getEntityId() + \",\" + event.getPlayer().getName()"
    blockly:
      label: "Wait for left block hit by a Player"
      returns: "Vec3"
      yields: "event.pos.clone()"
      player_filter: True

  - name: blockPlace
    bukkit_event: org.bukkit.event.block.BlockPlaceEvent
    # ENRICHED: Added player name (index 5)
    data: "event.getBlock().getX() + \",\" + event.getBlock().getY() + \",\" + event.getBlock().getZ() + \",\" + event.getBlock().getType().name() + \",\" + event.getPlayer().getEntityId() + \",\" + event.getPlayer().getName()"
    blockly:
      label: "Wait for block place by a Player"
      returns: "Vec3"
      yields: "event.pos.clone()"
      player_filter: True

  - name: blockBreak
    bukkit_event: org.bukkit.event.block.BlockBreakEvent
    # ENRICHED: Added player name (index 4)
    data: "event.getBlock().getX() + \",\" + event.getBlock().getY() + \",\" + event.getBlock().getZ() + \",\" + event.getPlayer().getEntityId() + \",\" + event.getPlayer().getName()"
    blockly:
      label: "Wait for block break by a Player"
      returns: "Vec3"
      yields: "event.pos.clone()"
      player_filter: True

  - name: chat
    bukkit_event: org.bukkit.event.player.AsyncPlayerChatEvent
    # ENRICHED: Added player name (index 1)
    data: "event.getPlayer().getEntityId() + \",\" + event.getPlayer().getName() + \",\" + event.getMessage()"
    blockly:
      label: "Wait for chat message from a Player"
      returns: "str"
      yields: "event.message"
      player_filter: True

  - name: projectileHitBlock
    bukkit_event: org.bukkit.event.entity.ProjectileHitEvent
    condition: "event.getHitBlock() != null"
    data: "event.getHitBlock().getX() + \",\" + event.getHitBlock().getY() + \",\" + event.getHitBlock().getZ() + \",\" + event.getEntity().getType().name()"
    blockly:
      label: "Wait for projectile to hit a block"
      returns: "Vec3"
      yields: "event.pos.clone()"
      player_filter: False

  - name: projectileHitEntity
    bukkit_event: org.bukkit.event.entity.ProjectileHitEvent
    condition: "event.getHitEntity() != null"
    # ENRICHED: Added target name (index 1)
    data: "event.getHitEntity().getEntityId() + \",\" + event.getHitEntity().getName() + \",\" + event.getEntity().getType().name() + \",\" + event.getHitEntity().getLocation().getX() + \",\" + event.getHitEntity().getLocation().getY() + \",\" + event.getHitEntity().getLocation().getZ()"
    blockly:
      label: "Wait for projectile to hit an entity"
      returns: "str"
      yields: "event.targetName"
      player_filter: False

  - name: projectileLaunch
    bukkit_event: org.bukkit.event.entity.ProjectileLaunchEvent
    condition: "event.getEntity().getShooter() instanceof org.bukkit.entity.Player"
    # ENRICHED: Added shooter name (index 1)
    data: "((org.bukkit.entity.Player)event.getEntity().getShooter()).getEntityId() + \",\" + ((org.bukkit.entity.Player)event.getEntity().getShooter()).getName() + \",\" + event.getEntity().getType().name()"
    blockly:
      label: "Wait for projectile launch by a Player"
      returns: "str"
      yields: "event.projectileType"
      player_filter: True
      player_attr: "shooterName"

  - name: playerDeath
    bukkit_event: org.bukkit.event.entity.PlayerDeathEvent
    # ENRICHED: Added player name (index 1)
    data: "event.getEntity().getEntityId() + \",\" + event.getEntity().getName() + \",\" + event.getEntity().getLocation().getX() + \",\" + event.getEntity().getLocation().getY() + \",\" + event.getEntity().getLocation().getZ()"
    blockly:
      label: "Wait for a Player death"
      returns: "str"
      yields: "event.name"
      player_filter: True

  - name: playerRespawn
    bukkit_event: org.bukkit.event.player.PlayerRespawnEvent
    # ENRICHED: Added player name (index 1)
    data: "event.getPlayer().getEntityId() + \",\" + event.getPlayer().getName() + \",\" + event.getRespawnLocation().getX() + \",\" + event.getRespawnLocation().getY() + \",\" + event.getRespawnLocation().getZ()"
    blockly:
      label: "Wait for a Player respawn"
      returns: "Vec3"
      yields: "event.pos.clone()"
      player_filter: True