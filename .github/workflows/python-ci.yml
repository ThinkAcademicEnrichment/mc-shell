# .github/workflows/python-ci.yml

name: CI Build and Test

on:
  push:
    branches: [ "main", "devel" ]
  pull_request:
    branches: [ "main", "devel" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # --- Fix: Added Java 21 Setup ---
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mced/package-lock.json

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: false
          virtualenvs-path: ~/.virtualenvs
          installer-parallel: true

      - name: Install all dependencies
        run: |
          poetry install --no-interaction
          npm --prefix mced ci

      - name: Vendor pyncraft library
        run: |
          git clone https://github.com/d4g33z/pyncraft.git ../pyncraft
          mkdir -p ./mcshell/vendored
          cp -R ../pyncraft/pyncraft ./mcshell/vendored/pyncraft

      - name: Build application (includes Maven build via build.py)
        run: |
          # Ensure current directory is correct or navigate to build.py location
          poetry run python build.py

      - name: Build frontend application
        working-directory: ./mced
        run: npm run build

      - name: Verify package build
        run: poetry build

      # --- New: Upload the compiled JAR as a build artifact ---
      - name: Upload McJuice JAR
        uses: actions/upload-artifact@v4
        with:
          name: mcjuice-jar-${{ matrix.python-version }}
          path: mcjuice/target/*.jar