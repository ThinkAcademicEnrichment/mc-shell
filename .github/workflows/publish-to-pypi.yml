# .github/workflows/publish-to-pypi.yml

name: Publish Package to PyPI and GitHub

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        id: java-17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up JDK 21
        id: java-21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up JDK 25
        id: java-25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Configure Maven Toolchains
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/toolchains.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>17</version>
                <vendor>openjdk</vendor>
              </provides>
              <configuration>
                <jdkHome>${{ steps.java-17.outputs.path }}</jdkHome>
              </configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>21</version>
                <vendor>openjdk</vendor>
              </provides>
              <configuration>
                <jdkHome>${{ steps.java-21.outputs.path }}</jdkHome>
              </configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>25</version>
                <vendor>openjdk</vendor>
              </provides>
              <configuration>
                <jdkHome>${{ steps.java-25.outputs.path }}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF       

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mced/package-lock.json

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.2.1  # Pin to 2.2.1 to avoid 2.3.1 installation issues
          virtualenvs-create: true
          virtualenvs-in-project: false
          virtualenvs-path: ~/.virtualenvs
          installer-parallel: true

      - name: Install all dependencies
        run: |
          poetry install --no-interaction
          npm --prefix mced ci

      - name: Build frontend application
        working-directory: ./mced
        run: npm run build

      - name: Build Source Distribution (sdist)
        run: poetry build --format sdist

      - name: Build Wheel from sdist
        run: pip wheel --no-deps --wheel-dir dist/ dist/*.tar.gz

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      # Re-run the build to ensure the /dist directory exists before uploading to the release.
      - name: Rebuild package for release asset
        run: poetry build
