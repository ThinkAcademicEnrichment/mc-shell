[tool.poetry]
name = "mc-shell"
version = "0.9.6"
description = "An interactive shell, Blockly editor and control for managing, programming and sharing Minecraft servers."
authors = ["Jeff <jeff@thinkae.org>"]
readme = "README.md"
packages = [{include = "mcshell"}]

# Must be in tool.poetry
include = [
    "mcshell/data/app/**/*",
    "mcshell/data/*.jar"
]

[virtualenvs]
in-project = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.10"

# Core Application Dependencies
mctools = "^1.4.1"
pexpect = "*"
flask = "*"
flask-cors = "*"
flask-socketio = "*"
python-socketio = {version = "*", extras = ["client"]}
requests = "*"
numpy = "*"
pyyaml = "^6.0.2"
yarl = "==1.20.1"
beautifulsoup4 = "*"
asyncssh = "^2.22.0"
miniupnpc = "^2.3.3"
psutil = "^7.2.2"
blockapily = "^0.3.3"

# IPython Shell Dependencies
ipython = "*"
pickleshare = "*" # For %store magic
rich = "*"
click = "*" # For the mcshell CLI entry point

pytest = "^9.0.2"

[tool.poetry.scripts]
mcshell = "mcshell.mcshell:cli"
