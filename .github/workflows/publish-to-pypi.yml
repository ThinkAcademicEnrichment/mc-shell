# .github/workflows/publish-to-pypi.yml
name: Publish Package to PyPI and GitHub

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mced/package-lock.json

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install all dependencies
        run: |
          poetry install --no-interaction
          npm --prefix mced ci

      - name: Vendor pyncraft library
        run: |
          git clone https://github.com/d4g33z/pyncraft.git ../pyncraft
          rm -rf ./mcshell/vendored/pyncraft
          mkdir -p ./mcshell/vendored
          cp -R ../pyncraft/pyncraft ./mcshell/vendored/pyncraft

      - name: Build the complete application
        working-directory: ./mced
        run: npm run build

      - name: Build the Python package
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Upload wheel as a release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/*.whl
          asset_name: mc_shell-${{ github.ref_name }}.whl
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}