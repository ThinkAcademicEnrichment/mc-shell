# .github/workflows/python-ci.yml

name: CI Build and Test

on:
  push:
    branches: [ "main", "devel" ]
  pull_request:
    branches: [ "main", "devel" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mced/package-lock.json

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.2.1  # Pin to 2.2.1 to avoid 2.3.1 installation issues
          virtualenvs-create: true
          virtualenvs-in-project: false
          virtualenvs-path: ~/.virtualenvs
          installer-parallel: true

      - name: Install all dependencies
        run: |
          poetry install --no-interaction
          npm --prefix mced ci

      - name: Vendor pyncraft library
        run: |
          git clone https://github.com/d4g33z/pyncraft.git ../pyncraft
          mkdir -p ./mcshell/vendored
          cp -R ../pyncraft/pyncraft ./mcshell/vendored/pyncraft

      - name: Build frontend application
        working-directory: ./mced
        run: npm run build

      - name: Run tests
        run: poetry run python -m unittest discover

      - name: Verify package build
        run: poetry build