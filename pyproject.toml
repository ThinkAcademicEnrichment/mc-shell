[tool.poetry]
name = "mc-shell"
version = "0.9.9"
description = "An interactive shell, Blockly editor and control for managing, programming and sharing Minecraft servers."
authors = ["Jeff <jeff@thinkae.org>"]
readme = "README.md"
packages = [{include = "mcshell"}]

# Must be in tool.poetry; include all gitignored generated files and mced src files for code generation
include = [
    "mcshell/actions/generated_actions.py",
    "mcshell/mcjuice.py",
    "mcshell/data/app/**/*",
    "mcshell/data/*.jar",
]

[virtualenvs]
in-project = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.10"

# Core Application Dependencies
mctools = "^1.4.1"
pexpect = "^4.9.0"
flask = "^3.1.3"
flask-cors = "^6.0.5"
flask-socketio = "^5.6.1"
python-socketio = {version = "^5.16.3", extras = ["client"]}
requests = "^2.34.2"
numpy = "^2.2.6"
pyyaml = "^6.0.2"
yarl = "^1.20.1"
beautifulsoup4 = "^4.15.0"
asyncssh = "^2.22.0"
miniupnpc = "^2.3.3"
psutil = "^7.2.2"
blockapily = "^0.4.2"

# IPython Shell Dependencies
ipython = "^8.39.0"
pickleshare = "^0.7.5"
rich = "^15.0.0"
click = "^8.4.1"

pytest = "^9.0.2"
ruamel-yaml = "^0.19.1"

trimesh = "^5.1.0"
scipy = "^1.15.3"

[tool.poetry.scripts]
mcshell = "mcshell.mcshell:cli"

[dependency-groups]
docs = [
    "zensical (>=0.0.51,<0.0.52)",
    "mkdocstrings[python] (>=1.0.6,<2.0.0)"
]
