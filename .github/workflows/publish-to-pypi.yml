# .github/workflows/publish-to-pypi.yml

name: Publish Package to PyPI and GitHub

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mced/package-lock.json

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install all dependencies
        run: |
          poetry install --no-interaction
          npm --prefix mced ci

      - name: Vendor pyncraft library
        run: |
          git clone https://github.com/d4g33z/pyncraft.git ../pyncraft
          mkdir -p ./mcshell/vendored
          cp -R ../pyncraft/pyncraft ./mcshell/vendored/pyncraft

      - name: Build frontend application
        working-directory: ./mced
        run: npm run build

      - name: Build Source Distribution (sdist)
        run: poetry build --format sdist

      - name: Build Wheel from sdist
        run: pip wheel --no-deps --wheel-dir dist/ dist/*.tar.gz

      - name: Publish to PyPI and GitHub
        # This composite action should handle the actual publishing
        uses: ./.github/actions/publish-package
        with:
          pypa_token: ${{ secrets.PYPI_API_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}