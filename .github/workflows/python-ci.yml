# .github/workflows/python-ci.yml

name: CI Build and Test

on:
  push:
    branches: [ "main", "devel" ]
  pull_request:
    branches: [ "main", "devel" ]
  # --- New: Weekly Scheduled Full Matrix Check ---
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight UTC

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
         # If it's a scheduled run, test the full matrix. Otherwise, stay fast on 3.10.
        python-version: ${{ github.event_name == 'schedule' && fromJSON('["3.10", "3.11", "3.12"]') || fromJSON('["3.10"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # --- Fix: Added Java 21 Setup ---
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mced/package-lock.json

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: false
          virtualenvs-path: ~/.virtualenvs
          installer-parallel: true

      - name: Install all dependencies
        run: |
          poetry install --no-interaction
          npm --prefix mced ci

      - name: Build application (includes Maven build via build.py)
        run: |
          # Ensure current directory is correct or navigate to build.py location
          poetry run python build.py

      - name: Build frontend application
        working-directory: ./mced
        run: npm run build

      - name: Run tests
        shell: bash
        run: |
          # Scheduled runs run on 'main' by default, so they will run all tests.
          if [[ "${{ github.ref_name }}" == "main" || "${{ github.base_ref }}" == "main" || "${{ github.event_name }}" == "schedule" ]]; then
            echo "Running all tests (including integration)..."
            poetry run pytest tests/integration
            poetry run pytest tests/unit
            poetry run pytest tests/mock
          else
            echo "Running fast tests only (skipping integration)..."
            # Discover and run tests in specific directories to exclude 'integration'
            poetry run pytest tests/unit
            poetry run pytest tests/mock
          fi

      - name: Verify package build
        run: poetry build

      # --- New: Upload the compiled JAR as a build artifact ---
      - name: Upload McJuice JAR
        uses: actions/upload-artifact@v4
        with:
          name: mcjuice-jar-${{ matrix.python-version }}
          path: mcjuice/target/*.jar