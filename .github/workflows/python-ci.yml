# .github/workflows/python-ci.yml
name: CI Build and Test

on:
  push:
    branches: [ "main", "devel" ]
  pull_request:
    branches: [ "main", "devel" ]
  schedule:
    - cron: "0 0 * * 0"

jobs:
  # --- JOB 1: Standard Ubuntu Run ---
  build-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        python-version: ${{ github.event_name == 'schedule' && fromJSON('["3.10", "3.11", "3.12"]') || fromJSON('["3.10"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Call the composite action
      - name: Run core build and test steps
        uses: ./.github/actions/build-test-mc-shell
        with:
          python-version: ${{ matrix.python-version }}
          run-integration-tests: ${{ github.ref_name == 'main' || github.base_ref == 'main' || github.event_name == 'schedule' }}

      - name: Upload McJuice JAR
        uses: actions/upload-artifact@v4
        with:
          name: mcjuice-jar-ubuntu-${{ matrix.python-version }}
          path: mcjuice/target/*.jar

  # --- JOB 2: ChromeOS / Debian Container Run ---
  chromeos-container-test:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref_name == 'main'
    strategy:
      matrix:
        # Fix: Store only the version names to avoid colon characters
        debian-version: ['bullseye', 'bookworm']
        
    # Fix: Construct the container image name here
    container:
      image: debian:${{ matrix.debian-version }}
      
    steps:
      - name: Install base container dependencies
        run: apt-get update && apt-get install -y curl git build-essential

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run core build and test steps
        uses: ./.github/actions/build-test-mcjuice
        with:
          python-version: '3.10'
          run-integration-tests: 'true'
          
      - name: Upload McJuice JAR (Debian)
        uses: actions/upload-artifact@v4
        with:
          # Fix: Safely construct the artifact name without needing functions
          name: mcjuice-jar-debian-${{ matrix.debian-version }}
          path: mcjuice/target/*.jar